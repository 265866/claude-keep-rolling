name: Diagnose darwin amd64

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15-intel
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Native build of this plugin
        env:
          VERSION: 0.0.1
          TARGETS: darwin/amd64
        run: ./scripts/release.sh && uname -m && go version
      - name: Smoke test native build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 0.0.1
          CPA_ASSET: darwin_amd64.tar.gz
        run: ./scripts/smoke-test.sh dist/claude-keep-rolling_0.0.1_darwin_amd64.zip
      - name: Build official CPA example plugin
        run: |
          git clone --depth 1 --branch v8.0.8 https://github.com/router-for-me/CLIProxyAPI.git /tmp/cpa
          cd /tmp/cpa/examples/plugin/host-model-callback/go
          sed -i '' -e 's#CLIProxyAPI/v7#CLIProxyAPI/v8#g' -e 's#v7.0.0#v8.0.0#g' go.mod
          go mod tidy
          go build -buildmode=c-shared -o /tmp/host-model-callback.dylib .
      - name: Load official example plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          work=$(mktemp -d)
          gh release download v8.0.8 -R router-for-me/CLIProxyAPI -p CLIProxyAPI_8.0.8_darwin_amd64.tar.gz -D "$work"
          tar -xzf "$work"/*.tar.gz -C "$work"
          mkdir -p "$work/data/plugins" "$work/data/auths"
          cp /tmp/host-model-callback.dylib "$work/data/plugins/"
          printf 'host: "127.0.0.1"\nport: 18317\nauth-dir: "auths"\nremote-management:\n  secret-key: "k"\n  disable-control-panel: true\nplugins:\n  enabled: true\n  dir: "plugins"\n  configs:\n    host-model-callback:\n      enabled: true\n' >"$work/data/config.yaml"
          cd "$work/data"
          "$work/cli-proxy-api" -config config.yaml >"$work/cpa.log" 2>&1 &
          pid=$!
          sleep 15
          if kill -0 "$pid" 2>/dev/null; then echo "EXAMPLE: CLIProxyAPI still running"; kill "$pid"; else echo "EXAMPLE: CLIProxyAPI exited"; fi
          grep -m 5 -E 'fatal|panic|plugin registered|plugin loaded' "$work/cpa.log" || true
