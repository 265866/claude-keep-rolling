name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      release: ${{ steps.next.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: next
        run: ./scripts/next-version.sh

  check:
    needs: version
    runs-on: ubuntu-latest
    # Bookworm matches the glibc of the official CLIProxyAPI image.
    container: docker.io/library/golang:1.26-bookworm
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          go install mvdan.cc/gofumpt@v0.12.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Format
        run: test -z "$(gofumpt -l .)" || { gofumpt -l .; exit 1; }
      - name: Tidy
        run: |
          go mod tidy
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - run: golangci-lint run ./...
      - run: go test -race -cover ./...
      - run: govulncheck ./...
      - name: Build Linux and Windows assets
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./scripts/release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: assets-linux-windows
          path: dist/*.zip
          if-no-files-found: error

  build-darwin:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # Latest 1.26.x, like the bookworm image. On darwin/amd64 the plugin and
      # CLIProxyAPI read each other's g and m structs, so the Go minor version must
      # match CLIProxyAPI's (1.26 for v8).
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Build Darwin assets
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGETS: darwin/arm64 darwin/amd64
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: ./scripts/release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: assets-darwin
          path: dist/*.zip
          if-no-files-found: error

  smoke:
    needs: [version, check, build-darwin]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux_amd64
            cpa-asset: linux_amd64.tar.gz
          - os: ubuntu-24.04-arm
            target: linux_arm64
            cpa-asset: linux_aarch64.tar.gz
          - os: macos-latest
            target: darwin_arm64
            cpa-asset: darwin_aarch64.tar.gz
          - os: macos-15-intel
            target: darwin_amd64
            cpa-asset: darwin_amd64.tar.gz
          - os: windows-latest
            target: windows_amd64
            cpa-asset: windows_amd64.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: assets-*
          merge-multiple: true
          path: dist
      - name: Load the plugin in CLIProxyAPI
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          CPA_ASSET: ${{ matrix.cpa-asset }}
        run: ./scripts/smoke-test.sh "dist/claude-keep-rolling_${VERSION}_${{ matrix.target }}.zip"
      - uses: actions/setup-go@v7
        if: runner.os != 'Windows'
        with:
          go-version: "1.26"
      - name: Recover host faults with the plugin loaded
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p faulthost-plugin
          unzip -q -o "dist/claude-keep-rolling_${VERSION}_${{ matrix.target }}.zip" -d faulthost-plugin
          go build -o faulthost-bin ./test/faulthost
          # Longer than the plugin's 20 s startup delay, so its own loop calls the host too.
          ./faulthost-bin -for 30s faulthost-plugin/claude-keep-rolling.*

  assemble:
    needs: [version, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: assets-*
          merge-multiple: true
          path: dist
      - name: Check assets and write checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd dist
          for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64 windows_amd64; do
            test -f "claude-keep-rolling_${VERSION}_${target}.zip"
          done
          test "$(ls *.zip | wc -l)" -eq 5
          sha256sum -- *.zip >checksums.txt
          cat checksums.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error

  release:
    needs: [version, assemble]
    if: github.event_name == 'push' && needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
