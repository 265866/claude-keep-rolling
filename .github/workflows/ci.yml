name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      release: ${{ steps.next.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: next
        run: ./scripts/next-version.sh

  check:
    needs: version
    runs-on: ubuntu-latest
    # Bookworm matches the glibc of the official CLIProxyAPI image.
    container: docker.io/library/golang:1.26-bookworm
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          go install mvdan.cc/gofumpt@v0.12.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Format
        run: test -z "$(gofumpt -l .)" || { gofumpt -l .; exit 1; }
      - name: Tidy
        run: |
          go mod tidy
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - run: golangci-lint run ./...
      - run: go test -race -cover ./...
      - run: govulncheck ./...
      - name: Build release assets
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./scripts/release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error

  release:
    needs: [version, check]
    if: github.event_name == 'push' && needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
